  '/api/v1/mods/{project_slug}/reviews':
    get:
      summary: 'List mod reviews.'
      operationId: listModReviews
      description: "Returns paginated written reviews for a mod. Only approved, published reviews with written content are included. Quick ratings (star-only, no text) and pending/rejected reviews are excluded. Each review includes category ratings, the author's Minecraft version and playtime context, and community vote counts."
      parameters:
        -
          in: query
          name: sort
          description: 'Sort field (`created_at`, `rating`, `helpful_votes`, `unhelpful_votes`). Default: `created_at`.'
          required: false
          schema:
            type: string
            description: 'Sort field (`created_at`, `rating`, `helpful_votes`, `unhelpful_votes`). Default: `created_at`.'
            examples:
              - created_at
        -
          in: query
          name: direction
          description: 'Sort direction (`asc` or `desc`). Default: `desc`.'
          required: false
          schema:
            type: string
            description: 'Sort direction (`asc` or `desc`). Default: `desc`.'
            examples:
              - desc
        -
          in: query
          name: per_page
          description: 'Results per page (max 50). Default: 15.'
          required: false
          schema:
            type: integer
            description: 'Results per page (max 50). Default: 15.'
            examples:
              - 15
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          examples:
                            - 1
                        is_quick_rating:
                          type: boolean
                          examples:
                            - false
                        title:
                          type: string
                          examples:
