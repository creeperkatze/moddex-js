openapi: 3.1.0
info:
  title: 'ModDex API Documentation'
  description: 'The ModDex API provides programmatic access to Minecraft mod and modpack reviews, project metadata, and community data.'
  version: 1.0.0
servers:
  - url: 'https://moddex.gg'
tags:
  - name: User
    description: "\nEndpoints for the authenticated API token holder."
  - name: Projects
    description: "\nEndpoints for browsing and viewing Minecraft mods and modpacks."
  - name: Reviews
    description: "\nEndpoints for browsing community reviews."
  - name: Tags
    description: "\nEndpoints for browsing project taxonomy tags (genres, features, themes, mod loaders, Minecraft versions)."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can create a token from your ModDex <b>Settings → API Tokens</b> page. Tokens are read-only, expire after 90 days, and can be revoked at any time. Successful responses include an <code>X-ModDex-Token-Expires</code> header. See the Token lifecycle section in the docs for error codes.'
security:
  -
    default: []
paths:
  /api/user:
    get:
      summary: 'Show the authenticated user.'
      operationId: showTheAuthenticatedUser
      description: 'Returns the profile for the user associated with the current Sanctum token, including reputation rank, social links, and privacy settings for library, follows, and user-directory visibility.'
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        examples:
                          - 1
                      name:
                        type: string
                        examples:
                          - Steve
                      username:
                        type: string
                        examples:
                          - steve
                      email:
                        type: string
                        examples:
                          - steve@example.com
                      email_verified_at:
                        type: string
                        examples:
                          - '2026-01-15T12:00:00+00:00'
                      bio:
                        type: string
                        examples:
                          - 'Minecraft mod enthusiast.'
                      avatar_url:
                        type: string
                        examples:
                          - 'https://moddex.gg/storage/avatars/1.png'
                      rank:
                        type: string
                        examples:
                          - contributor
                      social_links:
                        type: object
                        properties:
                          curseforge:
                            type:
                              - string
                              - 'null'
                            examples:
                              - null
                          modrinth:
                            type: string
                            examples:
                              - 'https://modrinth.com/user/steve'
                          github:
                            type: string
                            examples:
                              - 'https://github.com/steve'
                          discord_username:
                            type: string
                            examples:
                              - 'steve#0001'
                          discord_server:
                            type:
                              - string
                              - 'null'
                            examples:
                              - null
                          reddit:
                            type:
                              - string
                              - 'null'
                            examples:
                              - null
                          x:
                            type:
                              - string
                              - 'null'
                            examples:
                              - null
                          bluesky:
                            type:
                              - string
                              - 'null'
                            examples:
                              - null
                      library_is_public:
                        type: boolean
                        examples:
                          - true
                      follows_is_public:
                        type: boolean
                        examples:
                          - false
                      user_directory_is_public:
                        type: boolean
                        examples:
                          - true
                      two_factor_enabled:
                        type: boolean
                        examples:
                          - false
                      created_at:
                        type: string
                        examples:
                          - '2025-06-01T00:00:00+00:00'
                examples:
                  -
                    data:
                      id: 1
                      name: Steve
                      username: steve
                      email: steve@example.com
                      email_verified_at: '2026-01-15T12:00:00+00:00'
                      bio: 'Minecraft mod enthusiast.'
                      avatar_url: 'https://moddex.gg/storage/avatars/1.png'
                      rank: contributor
                      social_links:
                        curseforge: null
                        modrinth: 'https://modrinth.com/user/steve'
                        github: 'https://github.com/steve'
                        discord_username: 'steve#0001'
                        discord_server: null
                        reddit: null
                        x: null
                        bluesky: null
                      library_is_public: true
                      follows_is_public: false
                      user_directory_is_public: true
                      two_factor_enabled: false
                      created_at: '2025-06-01T00:00:00+00:00'
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - Unauthenticated.
                examples:
                  -
                    message: Unauthenticated.
        403:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Missing read ability'
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                          - 'Invalid ability provided.'
                    examples:
                      -
                        message: 'Invalid ability provided.'
                  -
                    description: 'Unverified email'
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                          - 'Your email address is not verified.'
                    examples:
                      -
                        message: 'Your email address is not verified.'
      tags:
        - User
  /api/v1/projects:
    get:
      summary: 'List projects.'
      operationId: listProjects
      description: "Returns a paginated list of active Minecraft mods and modpacks with community ratings, download counts, taxonomy tags, and supported Minecraft versions. Use `type` to filter mods vs modpacks, `sort` to rank by rating or popularity, and `featured` to surface editor picks.\n\n`bayesian_rating` adjusts for review count. Projects with few reviews are pulled toward the site-wide average, preventing a single 5-star review from outranking a project with hundreds of reviews."
      parameters:
        -
          in: query
          name: type
          description: 'Filter by project type (`mod` or `modpack`).'
          required: false
          schema:
            type: string
            description: 'Filter by project type (`mod` or `modpack`).'
            examples:
              - mod
        -
          in: query
          name: sort
          description: 'Sort field (`name`, `average_rating`, `bayesian_rating`, `total_ratings`, `total_reviews`, `downloads_count`, `last_updated_at`). `total_ratings` and `total_reviews` both rank by total ratings (quick ratings plus written reviews). Default: `name`.'
          required: false
          schema:
            type: string
            description: 'Sort field (`name`, `average_rating`, `bayesian_rating`, `total_ratings`, `total_reviews`, `downloads_count`, `last_updated_at`). `total_ratings` and `total_reviews` both rank by total ratings (quick ratings plus written reviews). Default: `name`.'
            examples:
              - average_rating
        -
          in: query
          name: direction
          description: 'Sort direction (`asc` or `desc`). Default: `desc`.'
          required: false
          schema:
            type: string
            description: 'Sort direction (`asc` or `desc`). Default: `desc`.'
            examples:
              - desc
        -
          in: query
          name: featured
          description: 'Return only featured projects.'
          required: false
          schema:
            type: boolean
            description: 'Return only featured projects.'
            examples:
              - true
        -
          in: query
          name: per_page
          description: 'Results per page (max 50). Default: 15.'
          required: false
          schema:
            type: integer
            description: 'Results per page (max 50). Default: 15.'
            examples:
              - 15
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          examples:
                            - 1
                        name:
                          type: string
                          examples:
                            - Create
                        slug:
                          type: string
                          examples:
                            - create
                        summary:
                          type: string
                          examples:
                            - 'Aesthetic Technology that empowers the Player'
                        type:
                          type: string
                          examples:
                            - mod
                        logo_url:
                          type: string
                          examples:
                            - 'https://...'
                        average_rating:
                          type: number
                          examples:
                            - 4.5
                        bayesian_rating:
                          type: number
                          examples:
                            - 4.2
                        total_ratings:
                          type: integer
                          examples:
                            - 12
                        total_reviews:
                          type: integer
                          examples:
                            - 8
                        written_reviews_count:
                          type: integer
                          examples:
                            - 8
                        downloads_count:
                          type: integer
                          examples:
                            - 500000
                        minecraft_versions:
                          type: array
                          items:
                            type: string
                          examples:
                            -
                              - 1.20.1
                              - 1.21.1
                        mod_loaders:
                          type: array
                          items:
                            type: string
                          examples:
                            -
                              - Forge
                              - NeoForge
                        genres:
                          type: array
                          items:
                            type: string
                          examples:
                            -
                              - Tech
                        last_updated_at:
                          type: string
                          examples:
                            - '2026-03-15T00:00:00+00:00'
                    examples:
                      -
                        -
                          id: 1
                          name: Create
                          slug: create
                          summary: 'Aesthetic Technology that empowers the Player'
                          type: mod
                          logo_url: 'https://...'
                          average_rating: 4.5
                          bayesian_rating: 4.2
                          total_ratings: 12
                          total_reviews: 8
                          written_reviews_count: 8
                          downloads_count: 500000
                          minecraft_versions:
                            - 1.20.1
                            - 1.21.1
                          mod_loaders:
                            - Forge
                            - NeoForge
                          genres:
                            - Tech
                          last_updated_at: '2026-03-15T00:00:00+00:00'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        examples:
                          - ...
                      last:
                        type: string
                        examples:
                          - ...
                      prev:
                        type:
                          - string
                          - 'null'
                        examples:
                          - null
                      next:
                        type: string
                        examples:
                          - ...
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        examples:
                          - 1
                      last_page:
                        type: integer
                        examples:
                          - 5
                      per_page:
                        type: integer
                        examples:
                          - 15
                      total:
                        type: integer
                        examples:
                          - 72
                examples:
                  -
                    data:
                      -
                        id: 1
                        name: Create
                        slug: create
                        summary: 'Aesthetic Technology that empowers the Player'
                        type: mod
                        logo_url: 'https://...'
                        average_rating: 4.5
                        bayesian_rating: 4.2
                        total_ratings: 12
                        total_reviews: 8
                        written_reviews_count: 8
                        downloads_count: 500000
                        minecraft_versions:
                          - 1.20.1
                          - 1.21.1
                        mod_loaders:
                          - Forge
                          - NeoForge
                        genres:
                          - Tech
                        last_updated_at: '2026-03-15T00:00:00+00:00'
                    links:
                      first: ...
                      last: ...
                      prev: null
                      next: ...
                    meta:
                      current_page: 1
                      last_page: 5
                      per_page: 15
                      total: 72
      tags:
        - Projects
