name: Publish Website

on:
    workflow_dispatch:
    release:
        types: [published]

jobs:
    test:
        name: Test
        uses: ./.github/workflows/test.yml

    current:
        name: Check release is current
        runs-on: ubuntu-latest
        outputs:
            current: ${{ steps.current.outputs.current }}
        steps:
            # The site documents the latest major, so a release of an older major doesn't replace it.
            - name: Check release is current
              id: current
              env:
                  VERSION: ${{ github.event.release.tag_name }}
              run: |
                  version="${VERSION#v}"
                  latest="$(curl -fsS https://registry.npmjs.org/-/package/moddex-js/dist-tags | jq -r '.latest // empty')"
                  if [[ -n "$version" && -n "$latest" && "${version%%.*}" -lt "${latest%%.*}" ]]; then
                      current=false
                  else
                      current=true
                  fi
                  echo "current=$current" >> "$GITHUB_OUTPUT"

    publish:
        name: Build and Publish Website
        needs: [test, current]
        if: needs.current.outputs.current == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Generate Docker image metadata
              id: docker_meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ghcr.io/creeperkatze/moddex-js
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                  labels: |
                      org.opencontainers.image.title=moddex-js docs
                      org.opencontainers.image.description=VitePress and TypeDoc site for moddex-js

            - name: Login to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push docs image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: website/Dockerfile
                  push: true
                  tags: ${{ steps.docker_meta.outputs.tags }}
                  labels: ${{ steps.docker_meta.outputs.labels }}
                  cache-from: type=registry,ref=ghcr.io/creeperkatze/moddex-js:main
                  cache-to: type=inline
